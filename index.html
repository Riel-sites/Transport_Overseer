function formatRosterText(ev){
  const pr = calcPricing(ev);
  const list = ev.passengers.filter(p => !p.deletedAt).sort((a, b) => a.listNumber - b.listNumber);
  const collected = ev.payments.reduce((s, p) => s + num(p.amount), 0);
  const outstanding = Math.max(0, pr.expected - collected);
  const lines = [];
  lines.push(`📋 ${ev.name}`);
  if (ev.eventDate) lines.push(`🗓  ${fmtDateOnly(ev.eventDate)}`);
  if (ev.deadlineAt) lines.push(`⏰ Entry deadline: ${fmtDate(ev.deadlineAt)}`);
  lines.push(`💺 ${list.length} people · ${money(pr.base)}/seat · Kids ${money(pr.kid)}`);
  lines.push('');
  for (const p of list) {
    const due = personDue(p, pr.base, pr.kid);
    const paid = paidFor(ev, p.id);
    const bal = due - paid;
    const badges = [];
    if (p.isKid) badges.push('kid');
    if (isLate(ev, p)) badges.push('late');
    let status;
    if (paid >= due - 0.005) status = '✅ Paid';
    else if (paid > 0.005) status = `⏳ Due ${money(bal)}`;
    else status = '❌ Unpaid';
    lines.push(`#${p.listNumber} ${p.name}${badges.length ? ` (${badges.join(', ')})` : ''} — ${money(due)} — ${status}`);
  }
  lines.push('');
  lines.push(`💰 Expected ${money(pr.expected)}`);
  lines.push(`✅ Collected ${money(collected)}`);
  if (outstanding > 0.005) lines.push(`⏳ Outstanding ${money(outstanding)}`);
  return lines.join('\n');
}
async function copyToClipboard(text){
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (_) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (_) { return false; }
}

/* ============================================================
   Pointer handlers (long-press + swipe)
   ============================================================ */
let longPressTimer = null;
let longPressTarget = null;
let suppressNextClick = false;
let swipe = null;

function cancelLongPress(){
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; longPressTarget = null; }
}
function resetSwipe(){
  if (!swipe) return;
  swipe.wrap?.classList.remove('swiping');
  if (swipe.row) swipe.row.style.transform = '';
  swipe = null;
}

document.addEventListener('pointerdown', e => {
  if (bulkMode) return;
  const row = e.target.closest('.listrow[data-eid]');
  if (!row) return;
  if (e.target.closest('[data-act="quick-pay"]')) return;
  const pid = row.dataset.id;
  const eid = row.dataset.eid;
  if (!pid || !eid) return;
  const evCheck = state.events.find(x => x.id === eid);
  if (evCheck && !canEdit(evCheck)) return;

  swipe = {
    startX: e.clientX, startY: e.clientY,
    wrap: row.closest('.swipe-wrap'),
    row, eid, pid,
    axis: null, offset: 0, active: true
  };

  longPressTarget = { eid, pid };
  longPressTimer = setTimeout(() => {
    const ev = state.events.find(x => x.id === eid);
    const p = ev?.passengers.find(x => x.id === pid);
    if (ev && p && !p.deletedAt) {
      const wasAtRisk = !!p.atRisk;
      p.atRisk = !p.atRisk;
      const ts = nowISO();
      p.updatedAt = ts;
      if (!Array.isArray(p.editHistory)) p.editHistory = [];
      p.editHistory.push({ field: 'atRisk', oldValue: wasAtRisk, newValue: p.atRisk, at: ts });
      ev.updatedAt = ts;
      markDirty(ev);
      logActivity(ev, p.atRisk ? 'passenger.atRisk.on' : 'passenger.atRisk.off', { name: p.name });
      suppressNextClick = true;
      persistAndRender();
      showToast(p.atRisk ? `${esc(p.name)} marked at-risk` : `${esc(p.name)} no longer at-risk`);
    }
    if (swipe) swipe.active = false;
    swipe = null;
    longPressTimer = null;
    longPressTarget = null;
  }, 500);
});

document.addEventListener('pointermove', e => {
  if (!swipe || !swipe.active) return;
  const dx = e.clientX - swipe.startX;
  const dy = e.clientY - swipe.startY;
  if (!swipe.axis) {
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
      swipe.axis = 'h';
      cancelLongPress();
      swipe.wrap?.classList.add('swiping');
    } else if (Math.abs(dy) > 10) {
      swipe.axis = 'v';
      cancelLongPress();
    } else {
      return;
    }
  }
  if (swipe.axis === 'h' && swipe.row) {
    const offset = Math.max(-110, Math.min(0, dx));
    swipe.offset = offset;
    swipe.row.style.transform = `translateX(${offset}px)`;
  }
}, { passive: true });

document.addEventListener('pointerup', () => {
  cancelLongPress();
  if (!swipe) return;
  const s = swipe;
  swipe = null;
  if (!s.wrap) { if (s.row) s.row.style.transform = ''; return; }
  s.wrap.classList.remove('swiping');
  if (s.row) s.row.style.transform = '';

  if (s.axis === 'h' && s.offset < -60) {
    const ev = state.events.find(x => x.id === s.eid);
    const p = ev?.passengers.find(x => x.id === s.pid);
    if (ev && p && softDeletePassenger(ev, p)) {
      suppressNextClick = true;
      logActivity(ev, 'passenger.removed', { name: p.name, pid: p.id });
      persistAndRender();
      showUndoToast(ev, p);
    }
  }
});

document.addEventListener('pointercancel', () => { cancelLongPress(); resetSwipe(); });

/* ============================================================
   Click / change delegation
   ============================================================ */
document.addEventListener('click', async e => {
  if (suppressNextClick) { suppressNextClick = false; e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.classList.contains('overlay') && e.target !== el) return;

  const act = el.dataset.act;
  if (!guardReadOnly(act, el)) return;
  const id = el.dataset.id;
  const eid = el.dataset.eid;

  switch (act) {
    case 'nav':           exitBulk(); state.view = { name: el.dataset.to }; persistAndRender(); break;
    case 'open-event':    exitBulk(); state.view = { name: 'event', id, tab: 'roster', filter: 'all' }; persistAndRender(); break;
    case 'tab':           exitBulk(); state.view.tab = el.dataset.tab; persistAndRender(); break;
    case 'filter':        bulkSelection.clear(); state.view.filter = el.dataset.filter; persistAndRender(); break;
    case 'density':       state.settings.rosterDensity = el.dataset.mode === 'compact' ? 'compact' : 'detailed'; save(); render(); break;

    case 'toggle-select': bulkMode = !bulkMode; bulkSelection.clear(); persistAndRender(); break;
    case 'toggle-select-one': {
      const pid = el.dataset.id;
      if (!pid) return;
      if (bulkSelection.has(pid)) bulkSelection.delete(pid); else bulkSelection.add(pid);
      render(); break;
    }
    case 'bulk-select-all': {
      const ev = state.events.find(x => x.id === state.view.id);
      if (!ev) return;
      const pr = calcPricing(ev);
      const filtered = filterPassengers(ev, state.view.filter || 'all', pr);
      const visible = filtered.map(p => p.id);
      if (bulkSelection.size === visible.length && visible.length > 0) bulkSelection.clear();
      else bulkSelection = new Set(visible);
      render(); break;
    }
    case 'bulk-mark-paid': {
      const ev = state.events.find(x => x.id === state.view.id);
      if (!ev) return;
      const n = bulkMarkPaid(ev, [...bulkSelection]);
      bulkSelection.clear();
      persistAndRender();
      if (n) showToast(`Marked ${n} as paid`); else showToast('Nothing to mark');
      break;
    }
    case 'bulk-toggle-kid': {
      const ev = state.events.find(x => x.id === state.view.id);
      if (!ev) return;
      const n = bulkToggle(ev, [...bulkSelection], 'isKid');
      bulkSelection.clear();
      persistAndRender();
      if (n) showToast(`Toggled kid for ${n}`); else showToast('Nothing selected');
      break;
    }
    case 'bulk-toggle-atRisk': {
      const ev = state.events.find(x => x.id === state.view.id);
      if (!ev) return;
      const n = bulkToggle(ev, [...bulkSelection], 'atRisk');
      bulkSelection.clear();
      persistAndRender();
      if (n) showToast(`Toggled at-risk for ${n}`); else showToast('Nothing selected');
      break;
    }
    case 'bulk-remove': {
      const ev = state.events.find(x => x.id === state.view.id);
      if (!ev) return;
      const affected = [];
      for (const pid of [...bulkSelection]) {
        const p = ev.passengers.find(x => x.id === pid);
        if (p && softDeletePassenger(ev, p)) affected.push(p);
      }
      if (affected.length) {
        logActivity(ev, 'passenger.bulk.removed', { count: affected.length, names: affected.map(p => p.name) });
      }
      bulkSelection.clear();
      persistAndRender();
      if (affected.length) showMultiUndoToast(ev, affected);
      break;
    }
    case 'bulk-export': {
      const ev = state.events.find(x => x.id === state.view.id);
      if (!ev) return;
      const ids = [...bulkSelection];
      if (!ids.length) { alert('Select some people first.'); return; }
      exportRosterCSV(ev, ids);
      break;
    }

    case 'import-csv': {
      const ev = state.events.find(x => x.id === id);
      if (ev) importCSVModal(ev); break;
    }
    case 'commit-import': {
      const ev = state.events.find(x => x.id === id);
      if (!ev || !importDraft) return;
      const chosen = importDraft.rows.filter(r => r.include);
      if (!chosen.length) { closeModal(); importDraft = null; return; }
      let next = ev.passengers.reduce((m, p) => Math.max(m, p.listNumber || 0), 0) + 1;
      const ts = nowISO();
      const names = [];
      for (const r of chosen) {
        ev.passengers.push({
          id: uid(), listNumber: next++,
          name: r.name, phone: r.phone || '', email: r.email || '',
          notes: r.notes || '', isKid: !!r.isKid, atRisk: !!r.atRisk,
          seatPriceOverride: null,
          addedAt: ts, updatedAt: ts
        });
        names.push(r.name);
      }
      ev.updatedAt = ts;
      markDirty(ev);
      logActivity(ev, 'passenger.bulk.imported', { count: names.length, names });
      closeModal(); importDraft = null;
      persistAndRender();
      showToast(`Imported ${names.length} passenger${names.length === 1 ? '' : 's'}`);
      break;
    }

    case 'new-event':     eventModal(null); break;
    case 'edit-event':    eventModal(state.events.find(x => x.id === id)); break;
    case 'delete-event': {
      const ev = state.events.find(x => x.id === id);
      if (!ev) return;
      if (!confirm('Delete this event and all its data?')) return;
      if (ev.remoteId && window.Cloud?.getUser()) {
        if (confirm('Also delete the cloud copy? (Cannot be undone.)')) {
          try { await Cloud.deleteRemote(ev.remoteId); } catch (e) { alert('Cloud delete failed: ' + e.message); }
        }
      }
      state.events = state.events.filter(x => x.id !== id);
      state.view = { name: 'events' };
      persistAndRender(); break;
    }

    case 'new-passenger': {
      const ev = state.events.find(x => x.id === id);
      passengerModal(ev, null); break;
    }
    case 'open-passenger': {
      const ev = state.events.find(x => x.id === eid);
      const p = ev?.passengers.find(x => x.id === id);
      if (ev && p) passengerDetailModal(ev, p);
      break;
    }
    case 'edit-passenger': {
      const ev = state.events.find(x => x.id === eid);
      const p = ev?.passengers.find(x => x.id === id);
      if (ev && p) passengerModal(ev, p);
      break;
    }
    case 'delete-passenger': {
      const ev = state.events.find(x => x.id === eid);
      const p = ev?.passengers.find(x => x.id === id);
      if (!ev || !p) return;
      if (!softDeletePassenger(ev, p)) return;
      logActivity(ev, 'passenger.removed', { name: p.name, pid: p.id });
      closeModal(); persistAndRender();
      showUndoToast(ev, p);
      break;
    }
    case 'restore-passenger': {
      const ev = state.events.find(x => x.id === eid);
      const p = ev?.passengers.find(x => x.id === id);
      if (!restorePassenger(ev, p)) return;
      logActivity(ev, 'passenger.restored', { name: p.name, pid: p.id });
      clearToast();
      persistAndRender(); break;
    }
    case 'undo-delete': {
      const ev = state.events.find(x => x.id === eid);
      const p = ev?.passengers.find(x => x.id === id);
      if (!restorePassenger(ev, p)) { clearToast(); return; }
      logActivity(ev, 'passenger.restored', { name: p.name, pid: p.id });
      persistAndRender();
      showToast(`Restored ${esc(p.name)}`);
      break;
    }
    case 'undo-delete-many': {
      const ev = state.events.find(x => x.id === eid);
      if (!ev) return;
      const ids = (el.dataset.ids || '').split(',').filter(Boolean);
      const restored = ids.map(pid => ev.passengers.find(x => x.id === pid)).filter(Boolean);
      const n = restorePassengers(ev, restored);
      clearToast();
      persistAndRender();
      if (n) showToast(`Restored ${n} people`);
      break;
    }
    case 'toggle-atRisk': {
      const ev = state.events.find(x => x.id === eid);
      const p = ev?.passengers.find(x => x.id === id);
      if (!ev || !p) return;
      const wasAtRisk = !!p.atRisk;
      p.atRisk = !p.atRisk;
      const ts = nowISO();
      p.updatedAt = ts;
      if (!Array.isArray(p.editHistory)) p.editHistory = [];
      p.editHistory.push({ field: 'atRisk', oldValue: wasAtRisk, newValue: p.atRisk, at: ts });
      ev.updatedAt = ts;
      markDirty(ev);
      logActivity(ev, p.atRisk ? 'passenger.atRisk.on' : 'passenger.atRisk.off', { name: p.name });
      closeModal(); persistAndRender(); break;
    }
    case 'quick-pay': {
      const ev = state.events.find(x => x.id === eid);
      const p = ev?.passengers.find(x => x.id === id);
      if (!ev || !p || p.deletedAt) return;
      paymentModal(ev, null, p.id);
      break;
    }
    case 'dismiss-tip': {
      if (!state.settings.tipsShown) state.settings.tipsShown = {};
      state.settings.tipsShown[el.dataset.tip] = true;
      persistAndRender(); break;
    }

    case 'record-payment': {
      const ev = state.events.find(x => x.id === id);
      if (ev) paymentModal(ev, null, null);
      break;
    }
    case 'record-payment-for': {
      const ev = state.events.find(x => x.id === eid);
      if (ev) { closeModal(); setTimeout(() => paymentModal(ev, null, id), 50); }
      break;
    }
    case 'edit-payment': {
      const ev = state.events.find(x => x.id === eid);
      const p = ev?.payments.find(x => x.id === id);
      if (ev && p) paymentModal(ev, p, null);
      break;
    }

    case 'new-template':  templateModal(null); break;
    case 'open-template': state.view = { name: 'template', id }; persistAndRender(); break;
    case 'edit-template': templateModal(state.templates.find(x => x.id === id)); break;
    case 'delete-template': {
      if (!confirm('Delete this template?')) return;
      state.templates = state.templates.filter(x => x.id !== id);
      state.view = { name: 'templates' };
      persistAndRender(); break;
    }
    case 'add-item': {
      const t = state.templates.find(x => x.id === id);
      if (t) templateItemModal(t, null); break;
    }
    case 'edit-item': {
      const t = state.templates.find(x => x.id === id);
      const it = t?.items.find(x => x.id === el.dataset.iid);
      if (t && it) templateItemModal(t, it); break;
    }
    case 'delete-item': {
      const t = state.templates.find(x => x.id === id);
      if (!t) return;
      t.items = t.items.filter(x => x.id !== el.dataset.iid);
      persistAndRender(); break;
    }
    case 'move-item': {
      const t = state.templates.find(x => x.id === id);
      if (!t) return;
      const i = t.items.findIndex(x => x.id === el.dataset.iid);
      const j = i + Number(el.dataset.dir);
      if (i < 0 || j < 0 || j >= t.items.length) return;
      [t.items[i], t.items[j]] = [t.items[j], t.items[i]];
      persistAndRender(); break;
    }
    case 'create-from-template': {
      const t = state.templates.find(x => x.id === id);
      if (t) createFromTemplateModal(t); break;
    }

    case 'export-roster':   exportRosterCSV(state.events.find(x => x.id === id)); break;
    case 'copy-roster': {
      const ev = state.events.find(x => x.id === id);
      if (!ev) return;
      const text = formatRosterText(ev);
      const ok = await copyToClipboard(text);
      if (ok) showToast('Roster copied — paste into WhatsApp, SMS or email');
      else {
        showModal(`
          <h2>Copy roster</h2>
          <div class="muted small" style="margin-bottom:8px">Clipboard is unavailable in this context. Select and copy the text below.</div>
          <textarea readonly style="width:100%;height:45vh;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;padding:10px;border:1px solid var(--line);border-radius:10px" onclick="this.select()">${esc(text)}</textarea>
          <div class="row gap mt12"><button class="btn primary" data-act="close-modal">Close</button></div>
        `);
      }
      break;
    }
    case 'export-payments': exportPaymentsCSV(state.events.find(x => x.id === id)); break;
    case 'export-json':     exportEventJSON(state.events.find(x => x.id === id)); break;
    case 'print-event':     printEvent(state.events.find(x => x.id === id)); break;
    case 'export-all':      download(`transport-roster-backup-${Date.now()}.json`, JSON.stringify(state, null, 2), 'application/json'); break;
    case 'import-json':     importJSON(); break;
    case 'clear-data': {
      if (!confirm('Erase ALL events, templates and payments on this device?')) return;
      if (!confirm('This cannot be undone. Continue?')) return;
      state = defaultState();
      persistAndRender(); break;
    }

    case 'sync-event': {
      const ev = state.events.find(x => x.id === id);
      if (!ev) return;
      if (!Cloud.isConfigured()) { alert('Set Supabase URL and anon key in Settings first.'); return; }
      try {
        const r = await Cloud.syncEvent(ev);
        persistAndRender();
        if (r === 'pulled') alert('Pulled latest from cloud.');
      } catch (e) {
        if (e.name === 'ConflictError') conflictModal(ev);
        else alert('Sync failed: ' + e.message);
      }
      break;
    }
    case 'sync-now': scheduleSyncFlush(0); break;
    case 'reload-app': {
      if (!navigator.serviceWorker?.controller) { location.reload(); break; }
      try {
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg?.waiting) {
          reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          // Fallback: if SKIP_WAITING didn't cause a reload within 2s, force one
          setTimeout(() => { if (!reloading) location.reload(); }, 2000);
        } else {
          location.reload();
        }
      } catch (_) { location.reload(); }
      break;
    }
    case 'install-app': {
      if (!deferredInstallPrompt) {
        alert('Installation not available right now.\n\nIf the app is already installed, look for it on your home screen. Otherwise try again in a browser that supports PWA installation (Chrome, Edge, Safari).');
        return;
      }
      deferredInstallPrompt.prompt();
      try {
        const { outcome } = await deferredInstallPrompt.userChoice;
        if (outcome === 'accepted') {
          deferredInstallPrompt = null;
          showToast('App installed');
          persistAndRender();
        }
      } catch (_) {}
      break;
    }
    case 'dismiss-install': {
      installBannerDismissed = true;
      state.settings.installBannerDismissed = true;
      persistAndRender();
      break;
    }
    case 'share-event': {
      const ev = state.events.find(x => x.id === id);
      if (ev) shareModal(ev);
      break;
    }
    case 'revoke-share': {
      const slug = el.dataset.slug;
      if (!slug) return;
      if (!confirm('Revoke this share link? Anyone using it will lose access on their next sync.')) return;
      const ev = state.view.name === 'event' ? state.events.find(x => x.id === state.view.id) : null;
      try {
        await Cloud.revokeShare(slug);
        if (ev) { logActivity(ev, 'share.revoked', { slug }); await loadShares(ev); }
        showToast('Share revoked');
      } catch (e) { alert('Revoke failed: ' + e.message); }
      break;
    }

    case 'conflict-pull': {
      const ev = state.events.find(x => x.id === id);
      try { await Cloud.pullEvent(ev); closeModal(); persistAndRender(); alert('Pulled remote.'); }
      catch (e) { alert('Pull failed: ' + e.message); }
      break;
    }
    case 'conflict-merge': {
      const ev = state.events.find(x => x.id === id);
      try { await Cloud.mergeRemote(ev); closeModal(); persistAndRender(); alert('Merged and pushed.'); }
      catch (e) {
        if (e.name === 'ConflictError') { closeModal(); conflictModal(ev); }
        else alert('Merge failed: ' + e.message);
      }
      break;
    }
    case 'conflict-force': {
      const ev = state.events.find(x => x.id === id);
      if (!confirm('Overwrite the remote copy with your local version? Any changes made by others will be lost.')) return;
      try { await Cloud.forcePushEvent(ev); closeModal(); persistAndRender(); alert('Force-pushed.'); }
      catch (e) { alert('Force push failed: ' + e.message); }
      break;
    }

    case 'sb-save': {
      state.settings.supabase = { url: val('sb_url').trim(), anonKey: val('sb_key').trim() };
      save(); alert('Keys saved.'); persistAndRender(); break;
    }
    case 'sb-signin': {
      if (!Cloud.isConfigured()) { alert('Save keys first.'); return; }
      const email = prompt('Email for magic link:');
      if (!email) return;
      try { await Cloud.signInWithEmail(email); alert('Check your email for the sign-in link.'); }
      catch (e) { alert(e.message); }
      break;
    }
    case 'sb-signout': {
      try { await Cloud.signOut(); alert('Signed out.'); persistAndRender(); } catch (e) { alert(e.message); }
      break;
    }

    case 'close-modal': closeModal(); break;
  }
});

document.addEventListener('change', e => {
  const cur = e.target.closest('[data-act="set-currency"]');
  if (cur) { state.settings.currency = cur.value; persistAndRender(); return; }
  const sort = e.target.closest('[data-act="sort"]');
  if (sort) { state.settings.rosterSort = sort.value; save(); render(); return; }
});

/* ============================================================
   Network / visibility listeners
   ============================================================ */
window.addEventListener('online',  () => { updateSyncIndicator(); scheduleSyncFlush(100); });
window.addEventListener('offline', () => updateSyncIndicator());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    updateSyncIndicator();
    if (window.Cloud?.getUser()) scheduleSyncFlush(300);
  }
});
setInterval(() => {
  if (!navigator.onLine || !window.Cloud?.getUser()) return;
  const hasDirty  = state.events.some(e => e.syncState === 'dirty' && e.myRole !== 'viewer');
  const hasViewer = state.events.some(e => e.myRole === 'viewer');
  if (hasDirty || hasViewer) flushQueue();
}, 30000);

/* ============================================================
   Boot
   ============================================================ */

/* ---------- Install prompt state (needed by views) ---------- */
let deferredInstallPrompt = null;
let installBannerDismissed = state.settings.installBannerDismissed === true;

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
}
function canShowInstallButton() {
  return !isStandalone() && !!deferredInstallPrompt;
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  if (state.view.name === 'events' && !installBannerDismissed) persistAndRender();
});

window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  showToast('App installed');
  persistAndRender();
});

/* ---------- Apple touch icon (iOS home screen) ---------- */
(function injectAppleTouchIcon() {
  if (document.querySelector('link[rel="apple-touch-icon"]')) return;
  try {
    const canvas = document.createElement('canvas');
    canvas.width = 180; canvas.height = 180;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0b6bcb';
    ctx.fillRect(0, 0, 180, 180);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 84px -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('TR', 90, 96);
    const link = document.createElement('link');
    link.rel = 'apple-touch-icon';
    link.href = canvas.toDataURL('image/png');
    document.head.appendChild(link);
  } catch (_) {}
})();

/* ---------- First render ---------- */
render();
if (window.Cloud) updateSyncIndicator();

/* ---------- Service worker: update management ---------- */
let lastUpdateOffer = 0;
let reloading = false;

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    const hadControllerOnBoot = !!navigator.serviceWorker.controller;

    navigator.serviceWorker.register('sw.js').then(reg => {
      if (reg.waiting && hadControllerOnBoot) offerReload();

      reg.addEventListener('updatefound', () => {
        const installing = reg.installing;
        if (!installing) return;
        installing.addEventListener('statechange', () => {
          if (installing.state === 'installed' && navigator.serviceWorker.controller) {
            offerReload();
          }
        });
      });

      checkForUpdate(reg);
    }).catch(err => console.warn('SW failed', err));

    // Only reload when we had a controller before (i.e. user tapped Reload)
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadControllerOnBoot) return;
      if (reloading) return;
      reloading = true;
      location.reload();
    });
  });
}

async function checkForUpdate(reg) {
  try {
    if (!('serviceWorker' in navigator)) return;
    const r = reg || await navigator.serviceWorker.getRegistration();
    if (!r) return;
    await r.update();
    if (r.waiting) offerReload();
  } catch (_) {}
}

function offerReload() {
  const now = Date.now();
  // Re-offer at most every 5 minutes
  if (now - lastUpdateOffer < 5 * 60 * 1000) return;
  lastUpdateOffer = now;
  showToast(`<span>New version available</span>
    <button data-act="reload-app">Reload</button>`);
}

// Re-check on tab focus, on reconnect, and every 15 minutes while visible
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') checkForUpdate();
});
window.addEventListener('online', () => checkForUpdate());
setInterval(() => {
  if (document.visibilityState === 'visible') checkForUpdate();
}, 15 * 60 * 1000);

/* ---------- PWA shortcuts ---------- */
(function handleShortcuts() {
  const p = new URLSearchParams(location.search);
  const action = p.get('action');
  if (!action) return;
  history.replaceState({}, '', location.pathname);
  if (action === 'new-event') {
    setTimeout(() => eventModal(null), 200);
  } else if (action === 'templates') {
    state.view = { name: 'templates' };
    persistAndRender();
  }
})();

/* ---------- Storage persistence ---------- */
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(() => {});
}
</script>
<script src="sync.js"></script>
